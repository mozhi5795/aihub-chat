<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聚合聊天</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>AI 聚合聊天</h1>
        <button id="btn-new-chat" class="btn primary block" title="新建对话">＋ 新建对话</button>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="sidebar-footer">
        <button id="btn-settings" class="btn ghost block">⚙ 设置</button>
        <button id="btn-export" class="btn ghost block">⬇ 导出记录</button>
        <button id="btn-import" class="btn ghost block">⬆ 导入记录</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>
    </aside>

    <main id="main">
      <header id="chat-header">
        <div class="chat-title-wrap">
          <input type="text" id="chat-title" placeholder="对话标题">
        </div>
        <div class="provider-bar">
          <label>厂商</label>
          <select id="provider-select"></select>
          <label>模型</label>
          <select id="model-select"></select>
        </div>
      </header>

      <section id="message-list"></section>

      <footer id="composer">
        <div id="composer-status" class="composer-status"></div>
        <textarea id="message-input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-actions">
          <button id="btn-clear-chat" class="btn ghost small">清空</button>
          <button id="btn-stop" class="btn danger small" hidden>停止</button>
          <button id="btn-send" class="btn primary">发送</button>
        </div>
      </footer>
    </main>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>设置</h2>
        <button class="modal-close" id="btn-close-settings">×</button>
      </div>
      <div class="modal-body">
        <div class="proxy-bar">
          <label>代理地址（可选，用于解决跨域 CORS。填入 Cloudflare Pages Functions 的地址即可，留空则直连厂商）
            <input type="text" id="proxy-url" placeholder="https://你的项目.pages.dev/api/proxy">
          </label>
          <div class="hint">本仓库已内置 <code>functions/api/proxy.js</code>，部署到 Cloudflare Pages 后此处填写你的线上地址。</div>
        </div>
        <div class="settings-grid">
          <div class="settings-left">
            <div class="settings-toolbar">
              <h3>厂商列表</h3>
              <button id="btn-add-provider" class="btn small primary">＋ 添加厂商</button>
            </div>
            <ul id="provider-list" class="provider-list"></ul>
          </div>
          <div class="settings-right">
            <div class="settings-toolbar">
              <h3 id="provider-form-title">厂商配置</h3>
              <button id="btn-delete-provider" class="btn small danger" hidden>删除</button>
            </div>
            <form id="provider-form">
              <label>名称
                <input type="text" id="p-name" placeholder="如：OpenAI / DeepSeek">
              </label>
              <label>接口类型
                <select id="p-type">
                  <option value="openai">OpenAI 兼容 (chat/completions)</option>
                  <option value="anthropic">Anthropic (Claude)</option>
                  <option value="gemini">Google Gemini</option>
                </select>
              </label>
              <label>API Base URL
                <input type="text" id="p-base-url" placeholder="https://api.openai.com/v1">
              </label>
              <label>API Key
                <input type="password" id="p-api-key" placeholder="sk-...">
              </label>
              <label>模型（多个用英文半角逗号 <code>,</code> 分隔）
                <input type="text" id="p-models" placeholder="gpt-4o, gpt-4o-mini">
              </label>
              <div class="form-actions">
                <button type="submit" class="btn primary">保存</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
